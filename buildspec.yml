version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "773658095475"
    AWS_REGION: "us-east-1"
    IMAGE_REPO: "python_app"
    CONTAINER_NAME: "python-app"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - REPO_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO}
      - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t ${IMAGE_REPO} .
      - docker tag ${IMAGE_REPO}:latest ${REPO_URI}:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push ${REPO_URI}:latest
      - echo Writing Image Definitions file...
      - printf '[{"name":"%s","imageUri":"%s"}]' "${CONTAINER_NAME}" "${REPO_URI}:latest" > imagedefinitions.json
      - printf '{"ImageURI":"%s"}' "${REPO_URI}:latest" > imageDetail.json
      - cat imagedefinitions.json

artifacts:
  files:
    - '**/*'
    - imagedefinitions.json
    - imageDetail.json
  secondary-artifacts:
    DefinitionArtifact:
      files:
        - appspec.json
        - taskdef.json
    ImageArtifact:
      files:
        - imageDetail.json